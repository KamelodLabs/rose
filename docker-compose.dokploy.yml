# Dokploy deployment. Compose Path in Dokploy: ./docker-compose.dokploy.yml
#
# No host ports and no Traefik labels on purpose: Dokploy's Domains tab injects
# the routing rules and TLS certificates per service/port, so nothing
# environment-specific lives in git.
#
# No container_name: Dokploy uses generated names for logs, metrics and routing.

services:
  api:
    build:
      context: ./apiRose
      dockerfile: Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    environment:
      PORT: 8080
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', '/app/server', '-healthcheck']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: webRose/Dockerfile
    init: true
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # When the web app calls the API server-side, use the internal network:
      # API_URL=http://api:8080
    expose:
      - '3000'
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
