name: rose

# Local development only. Dokploy uses docker-compose.dokploy.yml (no host ports,
# routing handled by its integrated Traefik).
# Portable stack: same images run on any Docker host. Ports are overridable
# without editing the file.

services:
  api:
    build:
      context: ./apiRose
      dockerfile: Dockerfile
    image: rose/api:local
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    environment:
      PORT: 8080
    ports:
      - '${API_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', '/app/server', '-healthcheck']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: webRose/Dockerfile
    image: rose/web:local
    init: true
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '${WEB_PORT:-3000}:3000'
    restart: unless-stopped
